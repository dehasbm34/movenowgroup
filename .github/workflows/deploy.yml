name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual triggering from the Actions tab

concurrency:
  # Cancel any in-progress deploy for the same ref so we only ever ship the latest commit
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish to Cloudflare Pages
    runs-on: ubuntu-latest

    permissions:
      contents: read   # checkout
      deployments: write  # post deployment status to GitHub

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Publish to movenowgroup.pages.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # We deploy the repo root as a static site — no build step needed.
          command: pages deploy . --project-name=movenowgroup --branch=main --commit-dirty=true
