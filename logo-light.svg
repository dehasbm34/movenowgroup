<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" role="img" aria-label="Move Now Group">
  <title>Move Now Group</title>
  <!-- Mark: gold ring on transparent, gold M -->
  <g>
    <circle cx="40" cy="40" r="34" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
    <circle cx="40" cy="40" r="28" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.4"/>
    <text x="40" y="54.5" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#C9A84C" text-anchor="middle">M</text>
  </g>
  <!-- Wordmark in light tone for dark backgrounds -->
  <text x="92" y="40" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" letter-spacing="2.5" fill="#FFFFFF">MOVE NOW</text>
  <line x1="92" y1="48" x2="285" y2="48" stroke="#C9A84C" stroke-width="0.75"/>
  <text x="92" y="64" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" letter-spacing="5.5" fill="#94A3B8">GROUP &#183; WORLDWIDE</text>
</svg>
